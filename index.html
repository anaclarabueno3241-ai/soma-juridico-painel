<title>SOMA Jurídico</title>
<style>
  :root{
    --bg: oklch(15.5% 0.045 262);
    --bg-raised: oklch(19% 0.05 262);
    --card: oklch(22.5% 0.055 261);
    --card-2: oklch(26% 0.06 260);
    --card-3: oklch(29% 0.065 260);
    --line: oklch(85% 0.02 250 / 0.14);
    --line-soft: oklch(85% 0.02 250 / 0.08);
    --ink-0: oklch(97.5% 0.006 250);
    --ink-1: oklch(78% 0.03 255);
    --ink-2: oklch(60% 0.035 258);
    --teal: oklch(80% 0.135 184);
    --teal-ink: oklch(18% 0.03 262);
    --teal-dim: oklch(80% 0.1 184 / 0.14);
    --violet: oklch(64% 0.16 288);
    --area-trab: oklch(74% 0.13 320); --area-trab-bg: oklch(74% 0.13 320 / 0.14);
    --area-civ: oklch(74% 0.12 250); --area-civ-bg: oklch(74% 0.12 250 / 0.16);
    --area-trib: oklch(80% 0.12 95); --area-trib-bg: oklch(80% 0.12 95 / 0.14);
    --area-soc: var(--teal); --area-soc-bg: var(--teal-dim);
    --area-adm: oklch(70% 0.02 258); --area-adm-bg: oklch(70% 0.02 258 / 0.14);
    --ok: oklch(78% 0.15 155); --ok-bg: oklch(78% 0.15 155 / 0.13);
    --warn: oklch(80% 0.14 80); --warn-bg: oklch(80% 0.14 80 / 0.14);
    --danger: oklch(70% 0.19 25); --danger-bg: oklch(70% 0.19 25 / 0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:'Work Sans',Helvetica,Arial,sans-serif;color:var(--ink-0);font-size:14px;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;font-weight:600;text-wrap:balance;}
  a{color:var(--teal);text-decoration:none;cursor:pointer;}
  a:hover{text-decoration:underline;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px;}
  ::selection{background:var(--teal-dim);color:var(--ink-0);}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }

  .icon{width:17px;height:17px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;}
  .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:600;}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:100px;white-space:nowrap;}
  .btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink-0);transition:background .15s;}
  .btn:hover{background:var(--card-2);}
  .btn-primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);}
  .btn-primary:hover{background:oklch(85% 0.14 184);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .navitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink-1);font-size:13.5px;font-weight:500;border:none;background:none;width:100%;text-align:left;}
  .navitem:hover{background:var(--card-2);color:var(--ink-0);}
  .navitem.active{background:var(--card-2);color:var(--ink-0);font-weight:600;}
  .navitem.active .icon{color:var(--teal);}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;padding:0 14px 12px 14px;}
  td{padding:13px 14px;font-size:13px;color:var(--ink-0);border-top:1px solid var(--line-soft);vertical-align:middle;}
  .row-link{cursor:pointer;}
  tr.row-link:hover td{background:var(--card-2);}
  div.row-link:hover{border-color:var(--teal);}
  .field{padding:12px 0;border-bottom:1px solid var(--line-soft);}
  .field:last-child{border-bottom:none;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card-3);border:1px solid var(--line);color:var(--ink-0);font-size:13px;font-weight:500;padding:12px 20px;border-radius:12px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 32px oklch(5% 0.02 262 / 0.5);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--teal-dim);border-top-color:var(--teal);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pulse-in{0%{background:var(--teal-dim);}100%{background:transparent;}}
  .just-added{animation:pulse-in 1.8s ease-out;}
  .scroll-x{overflow-x:auto;}
  select.filter, input.filter{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--ink-1);font-size:13px;}
  select.filter:focus, input.filter:focus{color:var(--ink-0);}
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div id="app" style="display:flex;min-height:100vh;"></div>
<div id="toast" class="toast"></div>

<script>
'use strict';

/* ============================= SUPABASE ============================= */

const SUPABASE_URL = 'https://wliolvgazvlfhobjfkdn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_QNtNneOrrIT1H172Vw6llw_3bGFltzO';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============================= DATA MODEL ============================= */

const AREAS = ['Trabalhista','Cível','Tributário','Societário','Administrativo'];
const AREA_VAR = {Trabalhista:'trab',Cível:'civ',Tributário:'trib',Societário:'soc',Administrativo:'adm'};

let PROCESSES = [];
let RESPONSIBLE = [];
let PRAZOS = []; // flat list of every prazo (aberto ou concluído), for the Prazos view
let ALL_MOVS = []; // flat list of every movimentação, for the "hoje" feed
let todayMovements = [];
let lastQueryTime = new Date();
let dataLoaded = false;
let loadError = null;

/* ============================= AUTENTICAÇÃO ============================= */

let session = null;
let authError = null;
let authLoading = false;

function userEmail(){ return (session && session.user && session.user.email) || ''; }
function userInitials(){
  const email = userEmail();
  if(!email) return '—';
  return email.slice(0,2).toUpperCase();
}

sb.auth.onAuthStateChange((event, newSession)=>{
  session = newSession;
  if(event === 'SIGNED_OUT'){
    dataLoaded = false;
    PROCESSES = []; RESPONSIBLE = []; PRAZOS = []; ALL_MOVS = []; todayMovements = [];
    render();
  }
});

function byId(id){ return PROCESSES.find(p=>p.id===id); }
function addDays(d,n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function isoDate(d){ return d.toISOString().slice(0,10); }

function fmtMoneyFull(n){
  if(n===null || n===undefined) return '—';
  return 'R$ ' + Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function relTime(d){
  const ms = Date.now() - new Date(d).getTime();
  const min = Math.floor(ms/60000);
  if(min<1) return 'agora mesmo';
  if(min<60) return `há ${min} min`;
  const h = Math.floor(min/60);
  if(h<24) return `há ${h}h`;
  const days = Math.floor(h/24);
  if(days<30) return `há ${days} dia${days===1?'':'s'}`;
  const months = Math.floor(days/30);
  return `há ${months} mês${months===1?'':'es'}`;
}
function fmtDateBR(d){ return new Date(d).toLocaleDateString('pt-BR'); }
function fmtTimeBR(d){ return new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr+'T00:00:00');
  return Math.round((target-today)/86400000);
}

/* ---------- carga real do Supabase ---------- */

async function loadAllData(){
  // TODO: quando o volume crescer (1000+ processos/dia), paginar essas consultas
  // em vez de trazer tudo de uma vez — hoje isso ainda é rápido porque o banco está no início.
  const [clientesRes, advRes, processosRes, movsRes, prazosRes, notasRes, docsRes] = await Promise.all([
    sb.from('clientes').select('id,nome'),
    sb.from('advogados_contrarios').select('id,nome,oab,email,telefone'),
    sb.from('processos').select('*'),
    sb.from('movimentacoes').select('*').order('data_hora',{ascending:false}).limit(1000),
    sb.from('prazos').select('*'),
    sb.from('notas').select('*').order('criado_em',{ascending:false}),
    sb.from('documentos').select('*').order('enviado_em',{ascending:false})
  ]);

  const firstError = clientesRes.error || advRes.error || processosRes.error || movsRes.error || prazosRes.error || notasRes.error || docsRes.error;
  if(firstError) throw firstError;

  const clientesById = {}; (clientesRes.data||[]).forEach(c=>clientesById[c.id]=c);
  const advById = {}; (advRes.data||[]).forEach(a=>advById[a.id]=a);

  const movsByProcesso = {};
  (movsRes.data||[]).forEach(m=>{
    (movsByProcesso[m.processo_id] = movsByProcesso[m.processo_id]||[]).push(m);
  });
  const prazosByProcesso = {};
  (prazosRes.data||[]).forEach(pz=>{
    (prazosByProcesso[pz.processo_id] = prazosByProcesso[pz.processo_id]||[]).push(pz);
  });
  const notasByProcesso = {};
  (notasRes.data||[]).forEach(n=>{
    (notasByProcesso[n.processo_id] = notasByProcesso[n.processo_id]||[]).push(n);
  });
  const docsByProcesso = {};
  (docsRes.data||[]).forEach(d=>{
    (docsByProcesso[d.processo_id] = docsByProcesso[d.processo_id]||[]).push(d);
  });

  PROCESSES = (processosRes.data||[]).map(row=>{
    const cliente = clientesById[row.cliente_id];
    const adv = advById[row.advogado_contrario_id];
    const movs = (movsByProcesso[row.id]||[]).slice().sort((a,b)=> new Date(b.data_hora)-new Date(a.data_hora));
    const lastMov = movs[0];
    const prazosAtivos = (prazosByProcesso[row.id]||[]).filter(pz=>!pz.cumprido && pz.data_limite).sort((a,b)=> new Date(a.data_limite)-new Date(b.data_limite));
    const nextPrazo = prazosAtivos[0] || null;

    return {
      id: row.id,
      number: row.numero_processo || '—',
      area: row.area || 'Administrativo',
      court: [row.tribunal, row.orgao_julgador].filter(Boolean).join(' · ') || '—',
      client: cliente ? cliente.nome : '—',
      adverse: row.parte_contraria || '—',
      responsible: row.responsavel || '—',
      status: row.status || 'Ativo',
      lastMovementText: lastMov ? lastMov.descricao : 'Sem movimentações registradas ainda',
      lastMovementAgo: lastMov ? relTime(lastMov.data_hora) : '—',
      lastMovementMinAgo: lastMov ? Math.floor((Date.now()-new Date(lastMov.data_hora).getTime())/60000) : Infinity,
      deadlineLabel: nextPrazo ? nextPrazo.tipo : '—',
      deadlineDays: nextPrazo ? Math.max(0, daysUntil(nextPrazo.data_limite)) : null,
      deadlineId: nextPrazo ? nextPrazo.id : null,
      valueCause: fmtMoneyFull(row.valor_causa),
      valueCondemnation: fmtMoneyFull(row.valor_condenacao),
      decision: row.decisao || 'Ainda não há decisão de mérito',
      agreement: row.acordo ? 'Sim' : 'Não',
      deposit: fmtMoneyFull(row.deposito),
      finalSettlement: fmtMoneyFull(row.valor_acordo_final),
      fgtsFine: fmtMoneyFull(row.multa_fgts),
      opposingLawyer: adv ? (adv.nome + (adv.oab ? ' (' + adv.oab + ')' : '')) : '—',
      opposingLawyerContact: adv ? (adv.email || '—') : '—',
      opposingLawyerPhone: adv ? (adv.telefone || '—') : '—',
      classe: row.classe || '—',
      assunto: row.assunto || '—',
      timeline: movs.map(m=>({date:fmtDateBR(m.data_hora), time:fmtTimeBR(m.data_hora), title:m.descricao, tag:m.instancia||'—', detail:m.complemento||''})),
      documents: (docsByProcesso[row.id]||[]),
      notesList: (notasByProcesso[row.id]||[])
    };
  });

  RESPONSIBLE = Array.from(new Set(PROCESSES.map(p=>p.responsible).filter(r=>r && r!=='—'))).sort();

  PRAZOS = (prazosRes.data||[]).map(pz=>{
    const p = byId(pz.processo_id);
    return { id:pz.id, processoId:pz.processo_id, descricao:pz.tipo, dataLimite:pz.data_limite, concluido:pz.cumprido, responsavel:pz.responsavel || (p?p.responsible:'—'), p };
  }).filter(x=>x.p); // descarta prazos órfãos (processo removido)

  ALL_MOVS = (movsRes.data||[]).map(m=>({ processoId:m.processo_id, texto:m.descricao, ts:new Date(m.data_hora) }));

  todayMovements = computeTodayMovements();
  lastQueryTime = new Date();
}

function computeTodayMovements(){
  const cutoff = Date.now() - 24*3600*1000;
  return ALL_MOVS.filter(m=>m.ts.getTime()>=cutoff)
    .sort((a,b)=>b.ts-a.ts)
    .slice(0,50)
    .map(m=>{
      const p = byId(m.processoId);
      if(!p) return null;
      return { processId:m.processoId, text:m.texto, ago:relTime(m.ts), urgency: p.deadlineDays===0?'danger':(p.deadlineDays!==null&&p.deadlineDays<=3?'warn':'ok') };
    }).filter(Boolean);
}

/* ============================= APP STATE ============================= */

const state = {
  view: 'dashboard', // dashboard | processos | detalhe | email
  selectedId: null,
  filters: { q:'', area:'Todas', status:'Todos', court:'Todos', responsible:'Todos' },
  page: 1,
  pageSize: 10,
  prazoFilters: { responsible:'Todos', area:'Todas', date:null },
  selectedClient: null,
  clientSearch: '',
  selectedLawyer: null,
  lawyerSearch: ''
};

function navigate(view, opts){
  state.view = view;
  if(opts && opts.id!==undefined) state.selectedId = opts.id;
  if(opts && opts.client!==undefined) state.selectedClient = opts.client;
  if(opts && opts.lawyer!==undefined) state.selectedLawyer = opts.lawyer;
  render();
  window.scrollTo(0,0);
}

/* ============================= HELPERS: UI bits ============================= */

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function areaTag(area){
  const v = AREA_VAR[area];
  return `<span class="tag" style="background:var(--area-${v}-bg);color:var(--area-${v});">${area}</span>`;
}
function statusTag(status){
  const map = {Ativo:['ok'],Suspenso:['warn'],Parado:['danger'],Arquivado:['adm']};
  const key = map[status] ? map[status][0] : 'adm';
  const bg = key==='adm' ? 'var(--area-adm-bg)' : `var(--${key}-bg)`;
  const fg = key==='adm' ? 'var(--area-adm)' : `var(--${key})`;
  return `<span class="tag" style="background:${bg};color:${fg};">${status}</span>`;
}
function deadlineTag(days){
  if(days===null) return `<span style="color:var(--ink-2);">—</span>`;
  if(days===0) return `<span class="tag" style="background:var(--danger-bg);color:var(--danger);">Hoje</span>`;
  if(days<=3) return `<span class="tag" style="background:var(--warn-bg);color:var(--warn);">${days} dias</span>`;
  return `<span class="tag" style="background:var(--ok-bg);color:var(--ok);">${days} dias</span>`;
}
function urgencyDot(u){
  const color = u==='danger' ? 'var(--danger)' : u==='warn' ? 'var(--warn)' : 'var(--ok)';
  return `<span style="width:7px;height:7px;border-radius:50%;background:${color};flex-shrink:0;margin-top:6px;"></span>`;
}
function parseMoney(str){
  if(!str || str==='—') return 0;
  return parseFloat(str.replace('R$','').trim().replace(/\./g,'').replace(',','.')) || 0;
}
function fmtMoney(n){
  return 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits:0, maximumFractionDigits:0});
}

function iconSvg(name){
  const icons = {
    grid:'<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/>',
    folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/>',
    users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.7 14.2A5 5 0 0 1 20.5 19"/>',
    sliders:'<path d="M4 6h10M4 12h16M4 18h10"/><circle cx="17" cy="6" r="2"/><circle cx="8" cy="18" r="2"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>',
    bell:'<path d="M6 8.6a6 6 0 1 1 12 0c0 4.2 1.6 5.4 1.6 5.4H4.4S6 12.8 6 8.6z"/><path d="M10 18a2 2 0 0 0 4 0"/>',
    chevronDown:'<path d="M6 9l6 6 6-6"/>',
    chevronLeft:'<path d="M15 6l-6 6 6 6"/>',
    chevronRight:'<path d="M9 6l6 6-6 6"/>',
    arrowLeft:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
    refresh:'<path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 15v-3h3"/>',
    mail:'<path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/>',
    file:'<path d="M6 3h8l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/>',
    building:'<path d="M4 21V10M20 21V10M2 10l10-6 10 6M6 21v-7M10 21v-7M14 21v-7M18 21v-7"/>',
    book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/>',
    check:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
    download:'<path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/>',
    x:'<path d="M6 6l12 12M18 6L6 18"/>',
    briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/><path d="M10 13v1.5h4V13"/>',
    phone:'<path d="M6.5 3h3l1.5 4-2 1.5a11 11 0 0 0 5.5 5.5l1.5-2 4 1.5v3a2 2 0 0 1-2 2C11 18.5 5.5 13 4.5 5a2 2 0 0 1 2-2z"/>'
  };
  return `<svg class="icon" viewBox="0 0 24 24">${icons[name]||''}</svg>`;
}

/* ============================= SHELL ============================= */

function shell(bodyHtml){
  const navItems = [
    {v:'dashboard', label:'Painel geral', icon:'grid'},
    {v:'processos', label:'Processos', icon:'folder'},
    {v:'prazos', label:'Prazos', icon:'calendar'},
    {v:'clientes', label:'Clientes', icon:'users'},
    {v:'advogados', label:'Advogados', icon:'briefcase'},
    {v:'relatorios', label:'Relatórios', icon:'sliders'}
  ];
  return `
  <aside style="width:232px;flex-shrink:0;background:var(--bg-raised);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;padding:26px 16px;position:sticky;top:0;height:100vh;">
    <div style="display:flex;align-items:center;gap:2px;padding:2px 8px 26px 8px;margin-bottom:22px;border-bottom:1px solid var(--line-soft);">
      <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:23px;letter-spacing:.01em;color:var(--ink-0);">SOMA</span>
      <span style="width:5px;height:5px;border-radius:50%;background:var(--teal);margin:0 2px 10px 3px;"></span>
      <span style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:12px;color:var(--ink-2);align-self:flex-end;margin-bottom:2px;">jurídico</span>
    </div>
    <nav style="display:flex;flex-direction:column;gap:3px;">
      ${navItems.map(n=>`<button class="navitem ${ (state.view===n.v || (n.v==='processos'&&state.view==='detalhe') || (n.v==='clientes'&&state.view==='clienteDetalhe') || (n.v==='advogados'&&state.view==='advogadoDetalhe')) ? 'active':''}" data-nav="${n.v}">${iconSvg(n.icon)}${n.label}</button>`).join('')}
    </nav>
    <div style="margin-top:auto;padding-top:18px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;">
      <div style="width:34px;height:34px;border-radius:50%;background:var(--teal-dim);border:1px solid var(--line);color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;">${esc(userInitials())}</div>
      <div style="min-width:0;flex:1;">
        <div style="color:var(--ink-0);font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${esc(userEmail())}">${esc(userEmail())}</div>

  const areaCounts = {}; AREAS.forEach(a=>areaCounts[a]=0);
  PROCESSES.forEach(p=>areaCounts[p.area]++);
  const totalP = PROCESSES.length;
  const circumference = 439.8;
  let offset = 0;
  const donutSegs = AREAS.map(a=>{
    const len = totalP>0 ? (areaCounts[a]/totalP)*circumference : 0;
    const seg = `<circle cx="100" cy="100" r="70" fill="none" stroke="var(--area-${AREA_VAR[a]})" stroke-width="26" stroke-dasharray="${len.toFixed(1)} ${circumference}" stroke-dashoffset="${(-offset).toFixed(1)}"/>`;

    </div>`).join('') || `<div style="font-size:13px;color:var(--ink-2);">Nenhum processo parado.</div>`;

        </div>
        <button id="btnConsultar" class="btn">${iconSvg('refresh')}Consultar agora</button>
        <button id="btnEmail" class="btn btn-primary">${iconSvg('mail')}Parecer diário por e-mail</button>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px;">
      <div class="card"><div style="display:flex;align-items:center;justify-content:space-between;"><span class="label">Processos ativos</span>${iconSvg('folder')}</div>
        <div style="font-family:'Space Grotesk',sans-serif;font-size:29px;font-weight:700;margin-top:14px;">${ativos}</div>

  `);
}

/* ============================= VIEW: PROCESSOS ============================= */

function filteredProcesses(){
  const f = state.filters;
  const q = f.q.trim().toLowerCase();
  return PROCESSES.filter(p=>{
    if(f.area!=='Todas' && p.area!==f.area) return false;
    if(f.status!=='Todos' && p.status!==f.status) return false;
    if(f.court!=='Todos' && p.court!==f.court) return false;
    if(f.responsible!=='Todos' && p.responsible!==f.responsible) return false;
    if(q){
      const hay = (p.number+' '+p.client+' '+p.adverse).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function viewProcessos(){
  const list = filteredProcesses();
  const totalPages = Math.max(1, Math.ceil(list.length/state.pageSize));
  if(state.page>totalPages) state.page = totalPages;
  const start = (state.page-1)*state.pageSize;
  const pageItems = list.slice(start, start+state.pageSize);

  const courts = Array.from(new Set(PROCESSES.map(p=>p.court))).sort();

  const rows = pageItems.map(p=>`
    <tr class="row-link" data-open="${p.id}">
      <td style="font-family:monospace;color:var(--ink-1);">${esc(p.number)}</td>
      <td style="font-weight:600;">${esc(p.client)}</td>
      <td style="color:var(--ink-1);">${esc(p.adverse)}</td>

  const opt = (arr, cur) => arr.map(v=>`<option ${v===cur?'selected':''}>${esc(v)}</option>`).join('');

  return shell(`
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap;">

        <h1 style="font-size:24px;">Processos</h1>

        ${iconSvg('search')}
        <input id="fq" class="filter" style="background:none;border:none;flex:1;padding:0;color:var(--ink-0);outline:none;" placeholder="Buscar por número, cliente ou parte..." value="${esc(state.filters.q)}">
      </div>
      <select id="fArea" class="filter"><option ${state.filters.area==='Todas'?'selected':''}>Todas</option>${opt(AREAS, state.filters.area)}</select>
      <select id="fStatus" class="filter"><option ${state.filters.status==='Todos'?'selected':''}>Todos</option>${opt(['Ativo','Suspenso','Parado','Arquivado'], state.filters.status)}</select>
      <select id="fCourt" class="filter"><option ${state.filters.court==='Todos'?'selected':''}>Todos</option>${opt(courts, state.filters.court)}</select>
      <select id="fResp" class="filter"><option ${state.filters.responsible==='Todos'?'selected':''}>Todos</option>${opt(RESPONSIBLE, state.filters.responsible)}</select>
    </div>

    <div class="card scroll-x" style="padding:0;overflow:hidden;">
      <div class="scroll-x">

        <thead><tr>
          <th style="padding-top:18px;">Nº do processo</th><th style="padding-top:18px;">Cliente</th><th style="padding-top:18px;">Parte contrária</th>
          <th style="padding-top:18px;">Área</th><th style="padding-top:18px;">Tribunal / Vara</th><th style="padding-top:18px;">Responsável</th>

/* ============================= VIEW: PRAZOS ============================= */

function viewPrazos(){
  const f = state.prazoFilters;
  const today = new Date(); today.setHours(0,0,0,0);

  let items = PRAZOS
    .filter(x=>!x.concluido && x.dataLimite)
    .map(x=>({ x, days: Math.max(0,daysUntil(x.dataLimite)), date: new Date(x.dataLimite+'T00:00:00') }));

  if(f.responsible!=='Todos') items = items.filter(it=>it.x.responsavel===f.responsible);
  if(f.area!=='Todas') items = items.filter(it=>it.x.p.area===f.area);
  if(f.date) items = items.filter(it=>isoDate(it.date)===f.date);
  items.sort((a,b)=>a.days-b.days);

  const hojeCount = items.filter(it=>it.days===0).length;
  const semanaCount = items.filter(it=>it.days>0 && it.days<=7).length;
  const mesCount = items.filter(it=>it.days>7 && it.days<=30).length;

  function rowHtml(it){
    const p = it.x.p;
    return `<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);">
      <button data-done="${it.x.id}" title="Marcar como cumprido" style="width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:none;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink-2);"></button>
      <div style="flex:1;min-width:0;cursor:pointer;" data-open="${p.id}">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap;">
          ${areaTag(p.area)}
          <span style="font-size:13px;font-weight:600;">${esc(it.x.descricao)}</span>
          <span style="font-size:12px;color:var(--ink-2);font-family:monospace;">${esc(p.number)}</span>
        </div>
        <div style="font-size:12.5px;color:var(--ink-2);">${esc(p.client)} · ${esc(p.court)} · resp.: ${esc(it.x.responsavel||'—')}</div>
      </div>
      <span style="font-size:12px;color:var(--ink-2);white-space:nowrap;">${it.date.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</span>
      ${deadlineTag(it.days)}
    </div>`;
  }

  function group(title, list, emptyMsg){
    if(!list.length) return `<div style="margin-bottom:24px;"><h3 style="font-size:14.5px;margin-bottom:10px;">${title} <span style="color:var(--ink-2);font-weight:500;font-family:'Work Sans';font-size:13px;">(0)</span></h3><div style="font-size:13px;color:var(--ink-2);">${emptyMsg}</div></div>`;
    return `<div style="margin-bottom:24px;">
      <h3 style="font-size:14.5px;margin-bottom:6px;">${title} <span style="color:var(--ink-2);font-weight:500;font-family:'Work Sans';font-size:13px;">(${list.length})</span></h3>
      <div>${list.map(rowHtml).join('')}</div>
    </div>`;
  }

  const gHoje = items.filter(it=>it.days===0);
  const gSemana = items.filter(it=>it.days>0 && it.days<=7);
  const gMes = items.filter(it=>it.days>7);

  // mini calendar for current month
  const y = today.getFullYear(), m = today.getMonth();
  const firstOfMonth = new Date(y,m,1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const countsByDay = {};
  items.forEach(it=>{
    if(it.date.getFullYear()===y && it.date.getMonth()===m){ countsByDay[it.date.getDate()] = (countsByDay[it.date.getDate()]||0)+1; }
  });
  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const isToday = day===today.getDate();
    const cnt = countsByDay[day]||0;
    const cellDate = new Date(y,m,day);
    const iso = isoDate(cellDate);
    const active = f.date===iso;
    cells += `<button data-cal-day="${iso}" style="aspect-ratio:1;border-radius:8px;border:1px solid ${active?'var(--teal)':'transparent'};background:${isToday?'var(--teal-dim)':cnt?'var(--card-2)':'none'};color:${isToday?'var(--teal)':'var(--ink-1)'};font-size:12px;font-weight:${isToday?'700':'400'};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;">
      <span>${day}</span>
      ${cnt?`<span style="width:4px;height:4px;border-radius:50%;background:${cnt>=3?'var(--danger)':'var(--teal)'};"></span>`:''}
    </button>`;
  }
  const weekLabels = ['D','S','T','Q','Q','S','S'].map(d=>`<div style="text-align:center;font-size:10.5px;color:var(--ink-2);font-weight:600;">${d}</div>`).join('');

  const responsibles = RESPONSIBLE;
  const doneList = PRAZOS.filter(x=>x.concluido);

  return shell(`
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px;gap:16px;flex-wrap:wrap;">
      <div>
        <h1 style="font-size:25px;">Prazos</h1>
        <div style="color:var(--ink-2);font-size:13.5px;margin-top:6px;">Agenda completa de prazos processuais — ${hojeCount} vencendo hoje, ${semanaCount} nos próximos 7 dias.</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <select id="pfResp" class="filter"><option ${f.responsible==='Todos'?'selected':''}>Todos</option>${responsibles.map(r=>`<option ${f.responsible===r?'selected':''}>${esc(r)}</option>`).join('')}</select>
        <select id="pfArea" class="filter"><option ${f.area==='Todas'?'selected':''}>Todas</option>${AREAS.map(a=>`<option ${f.area===a?'selected':''}>${esc(a)}</option>`).join('')}</select>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 320px;gap:18px;margin-top:22px;align-items:start;">

      <div>
        ${f.date?`<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:10px 14px;background:var(--teal-dim);border-radius:10px;font-size:13px;">Mostrando apenas prazos de ${new Date(f.date+'T00:00:00').toLocaleDateString('pt-BR')} <a id="clearDateFilter" style="margin-left:auto;">Limpar ✕</a></div>`:''}
        ${group('Vencendo hoje', gHoje, 'Nenhum prazo vencendo hoje.')}
        ${group('Esta semana (1–7 dias)', gSemana, 'Nenhum prazo nos próximos 7 dias.')}
        ${group('Próximos 30 dias', gMes, 'Nenhum prazo entre 8 e 30 dias.')}

        <div>
          <h3 style="font-size:14.5px;margin-bottom:10px;color:var(--ink-2);">Cumpridos <span style="font-weight:500;font-family:'Work Sans';font-size:13px;">(${doneList.length})</span></h3>
          ${doneList.length ? doneList.map(x=>`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft);opacity:.6;">
            <span style="color:var(--ok);">${iconSvg('check')}</span>
            <div style="flex:1;font-size:13px;text-decoration:line-through;">${esc(x.descricao)} — ${esc(x.p.client)}</div>
            <a data-undo="${x.id}">Desfazer</a>
          </div>`).join('') : `<div style="font-size:13px;color:var(--ink-2);">Nada marcado como cumprido ainda.</div>`}
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:18px;">
        <div class="card">
          <h3 style="font-size:14px;margin-bottom:14px;text-transform:capitalize;">${today.toLocaleDateString('pt-BR',{month:'long', year:'numeric'})}</h3>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;">${weekLabels}</div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">${cells}</div>
        </div>
        <div class="card">
          <h3 style="font-size:14px;margin-bottom:14px;">Resumo</h3>
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div style="display:flex;justify-content:space-between;font-size:13px;"><span style="color:var(--ink-1);">Vencendo hoje</span><span style="font-weight:700;color:var(--danger);">${hojeCount}</span></div>
            <div style="display:flex;justify-content:space-between;font-size:13px;"><span style="color:var(--ink-1);">Esta semana</span><span style="font-weight:700;color:var(--warn);">${semanaCount}</span></div>
            <div style="display:flex;justify-content:space-between;font-size:13px;"><span style="color:var(--ink-1);">Próximos 30 dias</span><span style="font-weight:700;">${mesCount}</span></div>
            <div style="display:flex;justify-content:space-between;font-size:13px;padding-top:10px;border-top:1px solid var(--line-soft);"><span style="color:var(--ink-1);">Cumpridos</span><span style="font-weight:700;color:var(--ok);">${doneList.length}</span></div>
          </div>
        </div>
      </div>

    </div>
  `);
}

/* ============================= VIEW: RELATÓRIOS ============================= */

const FIN_AREAS = ['Trabalhista','Cível','Tributário'];

function viewRelatorios(){
  // aggregate financial exposure per area (only areas with monetary claims)
  const areaAgg = {};
  FIN_AREAS.forEach(a=>areaAgg[a]={cause:0,condemn:0,count:0});
  PROCESSES.forEach(p=>{
    if(areaAgg[p.area]){
      areaAgg[p.area].cause += parseMoney(p.valueCause);
      areaAgg[p.area].condemn += parseMoney(p.valueCondemnation);
      areaAgg[p.area].count++;
    }
  });
  const maxBar = Math.max(1, ...FIN_AREAS.map(a=>areaAgg[a].cause));
  const totalCause = FIN_AREAS.reduce((s,a)=>s+areaAgg[a].cause,0);
  const totalCondemn = FIN_AREAS.reduce((s,a)=>s+areaAgg[a].condemn,0);

  const barsHtml = FIN_AREAS.map(a=>{
    const d = areaAgg[a];
    const wCause = Math.max(3, d.cause/maxBar*100);
    const wCondemn = Math.max(0, d.condemn/maxBar*100);
    return `<div style="margin-bottom:16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <span style="font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;"><span style="width:7px;height:7px;border-radius:50%;background:var(--area-${AREA_VAR[a]});"></span>${a} <span style="color:var(--ink-2);font-weight:400;">(${d.count} processos)</span></span>
        <span style="font-size:12.5px;color:var(--ink-1);">${fmtMoney(d.cause)} em causa</span>
      </div>
      <div style="height:10px;border-radius:100px;background:var(--bg);overflow:hidden;position:relative;">
        <div style="height:100%;width:${wCause}%;background:var(--card-3);border-radius:100px;"></div>
      </div>
      <div style="height:10px;border-radius:100px;background:var(--bg);overflow:hidden;position:relative;margin-top:4px;">
        <div style="height:100%;width:${wCondemn}%;background:var(--teal);border-radius:100px;"></div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:4px;"><span style="font-size:12px;color:var(--teal);">${fmtMoney(d.condemn)} em condenação/provisão</span></div>
    </div>`;
  }).join('');

  // top clients by exposure
  const clientAgg = {};
  PROCESSES.forEach(p=>{
    if(!FIN_AREAS.includes(p.area)) return;
    if(!clientAgg[p.client]) clientAgg[p.client] = {cause:0,condemn:0,count:0};
    clientAgg[p.client].cause += parseMoney(p.valueCause);
    clientAgg[p.client].condemn += parseMoney(p.valueCondemnation);
    clientAgg[p.client].count++;
  });
  const topClients = Object.entries(clientAgg).sort((a,b)=>(b[1].cause+b[1].condemn)-(a[1].cause+a[1].condemn)).slice(0,6);

  const topClientsRows = topClients.map(([name,d])=>`
    <tr class="row-link" data-filter-client="${esc(name)}">
      <td style="font-weight:600;">${esc(name)}</td>
      <td style="color:var(--ink-1);">${d.count}</td>
      <td style="color:var(--ink-1);">${fmtMoney(d.cause)}</td>
      <td style="color:var(--teal);font-weight:600;">${fmtMoney(d.condemn)}</td>
    </tr>`).join('');

  // productivity per responsible
  const respAgg = {};
  RESPONSIBLE.forEach(r=>respAgg[r]={total:0,ativos:0,atraso:0,parados:0});
  PROCESSES.forEach(p=>{
    const r = respAgg[p.responsible]; if(!r) return;
    r.total++;
    if(p.status==='Ativo') r.ativos++;
    if(p.deadlineDays===0) r.atraso++;
    if(p.status==='Parado') r.parados++;
  });
  const respRows = RESPONSIBLE.map(r=>`
    <tr><td style="font-weight:600;">${esc(r)}</td><td style="color:var(--ink-1);">${respAgg[r].total}</td><td style="color:var(--ink-1);">${respAgg[r].ativos}</td>
    <td style="color:${respAgg[r].atraso>0?'var(--danger)':'var(--ink-1)'};font-weight:${respAgg[r].atraso>0?'600':'400'};">${respAgg[r].atraso}</td>
    <td style="color:var(--ink-1);">${respAgg[r].parados}</td></tr>`).join('');

  // client dropdown for "histórico por cliente"
  const clientList = Array.from(new Set(PROCESSES.map(p=>p.client))).sort();


  return shell(`
    <div style="margin-bottom:8px;">
      <h1 style="font-size:25px;">Relatórios</h1>
      <div style="color:var(--ink-2);font-size:13.5px;margin-top:6px;">Visões consolidadas para gestão jurídica e provisionamento contábil — com base em ${PROCESSES.length} processos monitorados.</div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px;margin-bottom:18px;">
      <div class="card"><span class="label">Exposição total (causa)</span><div style="font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-top:12px;">${fmtMoney(totalCause)}</div></div>
      <div class="card"><span class="label" style="color:var(--teal);">Condenação/provisão total</span><div style="font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-top:12px;color:var(--teal);">${fmtMoney(totalCondemn)}</div></div>
      <div class="card"><span class="label">Clientes com exposição</span><div style="font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-top:12px;">${Object.keys(clientAgg).length}</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;">

      <div class="card">
        <h3 style="font-size:15.5px;margin-bottom:6px;">Provisão de contingências por área</h3>
        <div style="font-size:12.5px;color:var(--ink-2);margin-bottom:18px;">Valor de causa (cinza) e valor de condenação/provisão (teal) — societário e administrativo não possuem exposição financeira direta.</div>
        ${barsHtml}
      </div>

      <div class="card">
        <h3 style="font-size:15.5px;margin-bottom:16px;">Maior exposição por cliente</h3>
        <div class="scroll-x"><table>
          <thead><tr><th>Cliente</th><th>Processos</th><th>Valor de causa</th><th>Condenação/provisão</th></tr></thead>
          <tbody>${topClientsRows}</tbody>
        </table></div>
        <div style="font-size:11.5px;color:var(--ink-2);margin-top:10px;">Clique num cliente para ver os processos dele na lista.</div>
      </div>

      <div class="card">
        <h3 style="font-size:15.5px;margin-bottom:16px;">Produtividade por responsável</h3>
        <div class="scroll-x"><table>
          <thead><tr><th>Responsável</th><th>Total</th><th>Ativos</th><th>Prazos hoje</th><th>Parados</th></tr></thead>
          <tbody>${respRows}</tbody>
        </table></div>
      </div>

      <div class="card">
        <h3 style="font-size:15.5px;margin-bottom:6px;">Histórico por cliente</h3>
        <div style="font-size:12.5px;color:var(--ink-2);margin-bottom:16px;">Selecione um cliente para ver todos os processos monitorados dele.</div>
        <div style="display:flex;gap:10px;">
          <select id="repClient" class="filter" style="flex:1;">${clientList.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
          <button id="repClientGo" class="btn btn-primary">Gerar</button>
        </div>
      </div>

      <div class="card" style="grid-column:1 / -1;">
        <h3 style="font-size:15.5px;margin-bottom:8px;">Pareceres diários enviados <span style="color:var(--ink-2);font-weight:500;font-family:'Work Sans';font-size:13px;">(últimos 7 dias)</span></h3>
        <div style="font-size:13px;color:var(--ink-2);display:flex;align-items:center;justify-content:space-between;">
          <span>O envio automático do parecer diário por e-mail ainda não foi implementado — por enquanto, use "Visualizar parecer de hoje" no Painel geral.</span>
          <a id="repViewToday">Ver parecer de hoje →</a>
        </div>
      </div>

    </div>
  `);
}

/* ============================= RENDER + EVENTS ============================= */

function loginScreen(){
  return `<div style="display:flex;align-items:center;justify-content:center;width:100%;min-height:100vh;">
    <form id="loginForm" class="card" style="width:100%;max-width:360px;">
      <div style="text-align:center;margin-bottom:22px;">
        <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;letter-spacing:.01em;color:var(--ink-0);">SOMA</span>
        <span style="width:5px;height:5px;border-radius:50%;background:var(--teal);display:inline-block;margin:0 4px 5px;"></span>
        <span style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:13px;color:var(--ink-2);">jurídico</span>
      </div>
      <div style="padding-bottom:14px;">
        <label style="font-size:12px;color:var(--ink-2);display:block;margin-bottom:6px;">E-mail</label>
        <input id="loginEmail" type="email" required class="filter" style="width:100%;" autocomplete="username">
      </div>
      <div style="padding-bottom:18px;">
        <label style="font-size:12px;color:var(--ink-2);display:block;margin-bottom:6px;">Senha</label>
        <input id="loginPassword" type="password" required class="filter" style="width:100%;" autocomplete="current-password">
      </div>
      ${authError ? `<div style="color:var(--danger);font-size:12.5px;margin-bottom:14px;">${esc(authError)}</div>` : ''}
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" ${authLoading?'disabled':''}>${authLoading ? '<span class="spin"></span> Entrando...' : 'Entrar'}</button>
      <div style="text-align:center;margin-top:16px;font-size:12px;color:var(--ink-2);">Acesso restrito à equipe. Sem conta? Peça pra alguém do escritório criar a sua.</div>
    </form>
  </div>`;
}

function wireLoginEvents(){
  const form = document.getElementById('loginForm');
  if(!form) return;
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    authLoading = true; authError = null; render();
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    authLoading = false;
    if(error){
      authError = 'E-mail ou senha inválidos.';
      render();
      return;
    }
    session = data.session;
    boot();
  });
}

function loadingScreen(msg){
  return `<div style="display:flex;align-items:center;justify-content:center;width:100%;min-height:100vh;flex-direction:column;gap:14px;">
    <div class="spin" style="width:26px;height:26px;border-width:3px;"></div>
    <div style="color:var(--ink-2);font-size:13.5px;">${esc(msg)}</div>
  </div>`;
}
function errorScreen(err){
  return `<div style="display:flex;align-items:center;justify-content:center;width:100%;min-height:100vh;">
    <div class="card" style="max-width:520px;text-align:center;">
      <h3 style="font-size:16px;margin-bottom:10px;color:var(--danger);">Não foi possível carregar os dados do Supabase</h3>
      <div style="font-size:13px;color:var(--ink-1);margin-bottom:16px;">${esc(err)}</div>
      <button id="btnRetryLoad" class="btn btn-primary" style="width:100%;justify-content:center;">Tentar novamente</button>
    </div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  if(!session){ app.innerHTML = loginScreen(); wireLoginEvents(); return; }
  if(loadError){ app.innerHTML = errorScreen(loadError); const r=document.getElementById('btnRetryLoad'); if(r) r.addEventListener('click', boot); return; }
  if(!dataLoaded){ app.innerHTML = loadingScreen('Carregando dados do Supabase...'); return; }
  if(state.view==='dashboard') app.innerHTML = viewDashboard();
  else if(state.view==='processos') app.innerHTML = viewProcessos();
  else if(state.view==='detalhe') app.innerHTML = viewDetalhe();
  else if(state.view==='email') app.innerHTML = viewEmail();
  else if(state.view==='relatorios') app.innerHTML = viewRelatorios();
  else if(state.view==='prazos') app.innerHTML = viewPrazos();
  else if(state.view==='clientes') app.innerHTML = viewClientes();
  else if(state.view==='clienteDetalhe') app.innerHTML = viewClienteDetalhe();
  else if(state.view==='advogados') app.innerHTML = viewAdvogados();
  else if(state.view==='advogadoDetalhe') app.innerHTML = viewAdvogadoDetalhe();
  else app.innerHTML = viewDashboard();
  wireEvents();
}

function showToast(msg, spinning){
  const t = document.getElementById('toast');
  t.innerHTML = (spinning?'<span class="spin"></span>':iconSvg('check')) + '<span>'+esc(msg)+'</span>';
  t.classList.add('show');
  if(!spinning) setTimeout(()=>t.classList.remove('show'), 2600);
}

async function simulateQuery(){
  const btn = document.getElementById('btnConsultar');
  if(btn) btn.disabled = true;
  showToast('Atualizando com o banco de dados...', true);
  try{
    await loadAllData();
    document.getElementById('toast').classList.remove('show');
    setTimeout(()=>showToast('Dados atualizados', false), 200);
  }catch(err){
    document.getElementById('toast').classList.remove('show');
    setTimeout(()=>showToast('Falha ao atualizar: '+(err.message||err), false), 200);
  }
  render();
}

async function boot(){
  const { data } = await sb.auth.getSession();
  session = data.session;
  if(!session){ render(); return; }

  loadError = null;
  dataLoaded = false;
  render();
  try{
    await loadAllData();
    dataLoaded = true;
  }catch(err){
    loadError = (err && err.message) ? err.message : String(err);
  }
  render();
}

function wireEvents(){
  document.querySelectorAll('[data-logout]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.preventDefault();
      await sb.auth.signOut();
      session = null;
      dataLoaded = false;
      PROCESSES = []; RESPONSIBLE = []; PRAZOS = []; ALL_MOVS = []; todayMovements = [];
      render();
    });
  });
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const v = el.getAttribute('data-nav');
      if(v==='processos' || v==='dashboard' || v==='relatorios' || v==='prazos' || v==='clientes' || v==='advogados') navigate(v);
      else showToast('Esta seção ainda não está no protótipo.', false);
    });
  });
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=> navigate('detalhe', {id: el.getAttribute('data-open')}));
  });
  const back = document.getElementById('btnBack');
  if(back) back.addEventListener('click', ()=> navigate(state.view==='email' ? 'dashboard' : 'processos'));

  const bc = document.getElementById('btnConsultar');
  if(bc) bc.addEventListener('click', simulateQuery);
  const be = document.getElementById('btnEmail'); if(be) be.addEventListener('click', ()=>navigate('email'));
  const be2 = document.getElementById('btnEmail2'); if(be2) be2.addEventListener('click', ()=>navigate('email'));

  const gs = document.getElementById('globalSearch');
  if(gs) gs.addEventListener('keydown', e=>{ if(e.key==='Enter'){ state.filters.q = gs.value; state.page=1; navigate('processos'); } });

  const fq = document.getElementById('fq');
  if(fq) fq.addEventListener('input', ()=>{ state.filters.q = fq.value; state.page=1; renderKeepFocus('fq'); });
  ['fArea','fStatus','fCourt','fResp'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const map = {fArea:'area',fStatus:'status',fCourt:'court',fResp:'responsible'};
    el.addEventListener('change', ()=>{ state.filters[map[id]] = el.value; state.page=1; render(); });
  });
  const pv = document.getElementById('pgPrev'); if(pv) pv.addEventListener('click', ()=>{ state.page--; render(); });
  const nx = document.getElementById('pgNext'); if(nx) nx.addEventListener('click', ()=>{ state.page++; render(); });

  document.querySelectorAll('[data-filter-client]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.filters.q = el.getAttribute('data-filter-client');
      state.page = 1;
      navigate('processos');
    });
  });
  const repGo = document.getElementById('repClientGo');
  if(repGo) repGo.addEventListener('click', ()=>{
    const sel = document.getElementById('repClient');
    state.filters.q = sel.value;
    state.page = 1;
    navigate('processos');
  });
  const repToday = document.getElementById('repViewToday');
  if(repToday) repToday.addEventListener('click', ()=> navigate('email'));

  const pfResp = document.getElementById('pfResp');
  if(pfResp) pfResp.addEventListener('change', ()=>{ state.prazoFilters.responsible = pfResp.value; render(); });
  const pfArea = document.getElementById('pfArea');
  if(pfArea) pfArea.addEventListener('change', ()=>{ state.prazoFilters.area = pfArea.value; render(); });
  document.querySelectorAll('[data-cal-day]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const d = el.getAttribute('data-cal-day');
      state.prazoFilters.date = (state.prazoFilters.date===d) ? null : d;
      render();
    });
  });
  const clearDate = document.getElementById('clearDateFilter');
  if(clearDate) clearDate.addEventListener('click', ()=>{ state.prazoFilters.date = null; render(); });
  document.querySelectorAll('[data-done]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const prazoId = el.getAttribute('data-done');
      const { error } = await sb.from('prazos').update({cumprido:true}).eq('id', prazoId);
      if(error){ showToast('Falha ao salvar: '+error.message, false); return; }
      const x = PRAZOS.find(pz=>pz.id===prazoId); if(x) x.concluido = true;
      const p = byId(x ? x.processoId : null);
      if(p){
        const prazosAtivos = PRAZOS.filter(pz=>pz.processoId===p.id && !pz.concluido && pz.dataLimite).sort((a,b)=> new Date(a.dataLimite)-new Date(b.dataLimite));
        const next = prazosAtivos[0] || null;
        p.deadlineLabel = next ? next.descricao : '—';
        p.deadlineDays = next ? Math.max(0, daysUntil(next.dataLimite)) : null;
        p.deadlineId = next ? next.id : null;
      }
      showToast('Prazo marcado como cumprido', false);
      render();
    });
  });
  document.querySelectorAll('[data-undo]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const prazoId = el.getAttribute('data-undo');
      const { error } = await sb.from('prazos').update({cumprido:false}).eq('id', prazoId);
      if(error){ showToast('Falha ao salvar: '+error.message, false); return; }
      const x = PRAZOS.find(pz=>pz.id===prazoId); if(x) x.concluido = false;
      const p = byId(x ? x.processoId : null);
      if(p && x && x.dataLimite){
        const days = Math.max(0, daysUntil(x.dataLimite));
        if(p.deadlineDays===null || days<p.deadlineDays){ p.deadlineLabel = x.descricao; p.deadlineDays = days; p.deadlineId = x.id; }
      }
      render();
    });
  });

  const btnSaveNote = document.getElementById('btnSaveNote');
  if(btnSaveNote) btnSaveNote.addEventListener('click', async ()=>{
    const processoId = btnSaveNote.getAttribute('data-processo');
    const area = document.getElementById('notesArea');
    const texto = area ? area.value.trim() : '';
    if(!texto) return;
    btnSaveNote.disabled = true;
    const { data, error } = await sb.from('notas').insert({processo_id: processoId, texto}).select();
    btnSaveNote.disabled = false;
    if(error){ showToast('Falha ao salvar anotação: '+error.message, false); return; }
    const p = byId(processoId);
    if(p && data && data[0]) p.notesList.unshift(data[0]);
    showToast('Anotação salva', false);
    render();
  });

  const docUpload = document.getElementById('docUpload');
  if(docUpload) docUpload.addEventListener('change', async ()=>{
    const file = docUpload.files[0];
    if(!file) return;
    const processoId = docUpload.getAttribute('data-processo');
    const label = document.getElementById('docUploadLabel');
    if(label) label.textContent = 'Enviando...';
    const path = `${processoId}/${Date.now()}_${file.name}`;
    const { error: upErr } = await sb.storage.from('documentos').upload(path, file);
    if(upErr){ showToast('Falha no envio: '+upErr.message, false); if(label) label.textContent='Enviar documento'; return; }
    const { data, error } = await sb.from('documentos').insert({processo_id: processoId, nome_arquivo: file.name, caminho_arquivo: path}).select();
    if(error){ showToast('Falha ao registrar documento: '+error.message, false); return; }
    const p = byId(processoId);
    if(p && data && data[0]) p.documents.unshift(data[0]);
    showToast('Documento enviado', false);
    render();
  });

  document.querySelectorAll('[data-download-doc]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.preventDefault();
      const path = el.getAttribute('data-download-doc');
      const { data, error } = await sb.storage.from('documentos').createSignedUrl(path, 120);
      if(error){ showToast('Falha ao gerar link: '+error.message, false); return; }
      window.open(data.signedUrl, '_blank');
    });
  });

  document.querySelectorAll('[data-open-client]').forEach(el=>{
    el.addEventListener('click', ()=> navigate('clienteDetalhe', {client: el.getAttribute('data-open-client')}));
  });
  const btnBackClientes = document.getElementById('btnBackClientes');
  if(btnBackClientes) btnBackClientes.addEventListener('click', ()=> navigate('clientes'));
  const clientSearch = document.getElementById('clientSearch');
  if(clientSearch) clientSearch.addEventListener('input', ()=>{ state.clientSearch = clientSearch.value; renderKeepFocus('clientSearch'); });

  document.querySelectorAll('[data-open-lawyer]').forEach(el=>{
    el.addEventListener('click', ()=> navigate('advogadoDetalhe', {lawyer: el.getAttribute('data-open-lawyer')}));
  });
  document.querySelectorAll('[data-open-lawyer-cell]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); navigate('advogadoDetalhe', {lawyer: el.getAttribute('data-open-lawyer-cell')}); });
  });
  document.querySelectorAll('[data-open-client-cell]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); navigate('clienteDetalhe', {client: el.getAttribute('data-open-client-cell')}); });
  });
  const btnBackAdvogados = document.getElementById('btnBackAdvogados');
  if(btnBackAdvogados) btnBackAdvogados.addEventListener('click', ()=> navigate('advogados'));
  const lawyerSearch = document.getElementById('lawyerSearch');
  if(lawyerSearch) lawyerSearch.addEventListener('input', ()=>{ state.lawyerSearch = lawyerSearch.value; renderKeepFocus('lawyerSearch'); });
}

function renderKeepFocus(id){
  const el = document.getElementById(id);
  const pos = el ? el.selectionStart : null;
  render();
  const el2 = document.getElementById(id);
  if(el2){ el2.focus(); if(pos!==null) el2.setSelectionRange(pos,pos); }
}

boot();
</script>
